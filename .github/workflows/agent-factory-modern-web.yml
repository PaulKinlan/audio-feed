name: 'Agent Factory - Modern Web Audit'

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  modern-web:
    name: 'Modern Web Audit (DeepSeek)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify DeepSeek API Key Secret
        shell: bash
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.deepseek_api_key }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is not configured in repository secrets."
            exit 1
          fi

      - name: Install Beads CLI
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing bd (Beads CLI v1.3.0)..."
          EXPECTED_SHA256="2f92b904ecf35b607e44dc5c39229173af69c54f1183e8d709f1773540cdcf3b"
          TARBALL="$RUNNER_TEMP/beads_1.3.0_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz" -o "$TARBALL"
          echo "${EXPECTED_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$TARBALL" bd
          sudo chmod +x /usr/local/bin/bd
          rm -f "$TARBALL"
          bd --version

      - name: Set up Beads Database
        shell: bash
        run: |
          set -euo pipefail
          echo "Initializing and restoring Beads Dolt database..."
          git fetch origin refs/dolt/data:refs/dolt/data || true
          bd init --prefix audio-feed || true
          bd dolt pull origin
          bd list >/dev/null
          bd ready || true

      - name: Run Modern Web Factory Agent
        id: factory_agent
        uses: PaulKinlan/agents/.github/actions/factory@1cbddeeff89687c93d2b1bf3ca595e1eeba4a79b
        with:
          agent: modern-web
          target: '.'
          engine: deepseek
          sink: 'github-issues,beads'
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY || secrets.deepseek_api_key }}
          deepseek_model: 'deepseek-chat'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          factory_ref: '1cbddeeff89687c93d2b1bf3ca595e1eeba4a79b'

      - name: Verify Audit Report Production
        shell: bash
        env:
          DELTA_REPORT: ${{ steps.factory_agent.outputs.delta_report }}
        run: |
          set -euo pipefail
          echo "Verifying modern-web audit produced findings report..."
          if [ -z "$DELTA_REPORT" ]; then
            echo "::error::Factory agent completed with no report output (silent no-op)."
            exit 1
          fi
          if [ ! -f "$DELTA_REPORT" ]; then
            echo "::error::Report file '$DELTA_REPORT' was declared but does not exist on disk."
            exit 1
          fi
          echo "Report verified: $DELTA_REPORT ($(wc -l < "$DELTA_REPORT") lines)"

      - name: Sync Beads Database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ".beads" ] && command -v bd >/dev/null 2>&1; then
            echo "Syncing Beads Dolt database to origin..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            bd dolt push origin
          fi
