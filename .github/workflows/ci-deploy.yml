name: CI & Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (Assets, Typecheck, Dry-Run, Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full gate
        run: npm run gate

  deploy:
    name: Deploy to Cloudflare Workers
    needs: gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://audiofeed.app
    env:
      CI: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6f9efce6584ce03953e7e3d1f1c364cb' }}
    steps:
      - name: Verify CLOUDFLARE_API_TOKEN secret
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not configured in GitHub repository secrets. Add it in Settings -> Secrets and variables -> Actions (or run: gh secret set CLOUDFLARE_API_TOKEN)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply audio-feed --remote

      - name: Deploy Worker
        run: npx wrangler deploy --var "GIT_COMMIT_SHA:${GITHUB_SHA}"

      - name: Verify live health & commit
        run: |
          set -euo pipefail
          HEALTH="$(curl -fsS https://audiofeed.app/health)"
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          echo "$HEALTH" | grep -q "\"commit\":\"${GITHUB_SHA}\""
          curl -fsSI https://audiofeed.app/icon.png | grep -iq 'content-type: image/png'
